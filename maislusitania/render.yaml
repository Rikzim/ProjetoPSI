services:
  # Web Service running both frontend and backend
  - type: web
    name: maislusitania-web
    env: docker
    dockerfilePath: Dockerfile.render
    plan: starter
    disk:
      name: uploads-disk
      mountPath: /app/frontend/web/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: mysql://yii2advanced:${MYSQL_PASSWORD}@maislusitania-db:3306/yii2advanced
      - key: MYSQL_PASSWORD
        fromService:
          type: pserv
          name: maislusitania-db
          envVarKey: MYSQL_PASSWORD

  # MySQL Private Service Database
  - type: pserv
    name: maislusitania-db
    env: image
    image:
      url: mysql:8.0
    plan: starter
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: MYSQL_DATABASE
        value: yii2advanced
      - key: MYSQL_USER
        value: yii2advanced
      - key: MYSQL_PASSWORD
        generateValue: true
